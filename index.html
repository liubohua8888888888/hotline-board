<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>热线看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#4f6ef7;--primary-light:#eef1ff;--primary-dark:#3b55d9;--success:#22c55e;--danger:#ef4444;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.1);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{font-family:var(--font);background:#f3f4f6;color:#1f2937;min-height:100vh}
.header{background:linear-gradient(135deg,#4f6ef7,#6c5ce7);color:#fff;padding:20px 24px 16px;position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.header h1{font-size:18px;font-weight:700}
.header p{font-size:12px;opacity:.8}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);text-decoration:none}
.btn-white{background:#fff;color:#4f6ef7}.btn-white:hover{background:#eef1ff}
.btn-outline{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}.btn-outline:hover{background:rgba(255,255,255,.1)}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-green{background:#22c55e;color:#fff}.btn-red{background:#ef4444;color:#fff}
.btn-ghost{background:transparent;color:#6b7280}.btn-ghost:hover{background:#e5e7eb}
.stats{max-width:1200px;margin:-10px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);overflow:hidden}
.stats>div{padding:14px 10px;text-align:center}
.stats>div+div{border-left:1px solid #e5e7eb}
.stat-num{font-size:20px;font-weight:700;color:#4f6ef7}
.stat-lbl{font-size:11px;color:#9ca3af;margin-top:2px}
.main{max-width:1200px;margin:0 auto;padding:16px 20px 40px}
.tabs{display:flex;gap:2px;margin-bottom:12px;background:#e5e7eb;padding:3px;border-radius:6px;width:fit-content;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:5px;font-size:11px;border:none;background:transparent;color:#6b7280;cursor:pointer;font-family:var(--font)}
.tab.on{background:#fff;color:#4f6ef7;box-shadow:var(--shadow)}
.bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:160px;position:relative}
.search input{width:100%;padding:7px 12px 7px 32px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none}
.search input:focus{border-color:#4f6ef7}
.search span{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;color:#9ca3af}
.chip{padding:3px 8px;border-radius:12px;font-size:11px;cursor:pointer;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280}
.chip.on{background:#4f6ef7;color:#fff;border-color:#4f6ef7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:14px;position:relative;cursor:pointer;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.card.today{border:1.5px solid #4f6ef7;background:linear-gradient(135deg,#fff,#eef1ff)}
.badge{position:absolute;top:-7px;right:10px;background:#4f6ef7;color:#fff;font-size:9px;padding:2px 8px;border-radius:8px;font-weight:600}
.tag{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500}
.tag-日报{background:#dbeafe;color:#1d4ed8}.tag-周报{background:#dcfce7;color:#15803d}
.tag-公告{background:#fef3c7;color:#b45309}.tag-通知{background:#fce7f3;color:#be185d}
.tag-项目文档{background:#ede9fe;color:#6d28d9}.tag-其他{background:#e5e7eb;color:#4b5563}
.card h3{font-size:13px;font-weight:600;margin:6px 0 4px;line-height:1.4}
.card .desc{font-size:11px;color:#6b7280;line-height:1.5;margin-bottom:6px}
.card .meta{font-size:10px;color:#9ca3af;display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.card .meta .d{background:#f3f4f6;padding:1px 5px;border-radius:3px;color:#6b7280}
.tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.mini-tag{font-size:9px;padding:1px 5px;border-radius:3px;background:#f3f4f6;color:#6b7280}
.acts{display:flex;gap:4px;margin-top:auto;border-top:1px solid #e5e7eb;padding-top:8px}
.img-grid{display:grid;gap:4px;margin:6px 0}
.img-grid img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.empty{padding:50px 20px;text-align:center;color:#9ca3af}
.empty .eicon{font-size:36px;margin-bottom:10px}
.empty p{font-size:13px}
.section-title{font-size:14px;font-weight:600;margin-bottom:8px;margin-top:14px}
.section-title .c{font-weight:400;color:#9ca3af;font-size:11px}
.group{margin-bottom:20px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-size:16px;font-weight:700;margin-bottom:12px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:11px;font-weight:500;color:#374151;margin-bottom:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:12px;outline:none}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:#4f6ef7}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form-acts{display:flex;justify-content:flex-end;gap:6px;margin-top:12px;border-top:1px solid #e5e7eb;padding-top:10px}
.toasts{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:4px}
.toast{padding:8px 16px;border-radius:6px;color:#fff;font-size:12px;box-shadow:var(--shadow-lg);animation:tin .3s}
.toast.g{background:#22c55e}.toast.r{background:#ef4444}.toast.b{background:#4f6ef7}
@keyframes tin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header"><div class="header-inner">
<div><h1>热线看板</h1><p>业务更新 · 数据报告 · 每日跟进</p></div>
<div style="display:flex;align-items:center;gap:6px">
<span id="syncStatus" style="font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px">☁️ 本地</span>
<span id="dateDisplay" style="font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px"></span>
<button class="btn btn-outline btn-sm" onclick="toggleAdmin()">🔧 管理</button>
</div></div></div>

<div class="stats" id="statsBar">
<div><div class="stat-num" id="stTotal">0</div><div class="stat-lbl">全部链接</div></div>
<div><div class="stat-num" id="stToday">0</div><div class="stat-lbl">今日更新</div></div>
<div><div class="stat-num" id="stTypes">0</div><div class="stat-lbl">分类数</div></div>
<div><div class="stat-num" id="stDepts">0</div><div class="stat-lbl">涉及部门</div></div>
</div>

<div class="main" id="mainContent">

<div id="adminPanel" style="display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px">
<span style="font-size:12px;font-weight:500;color:#3b55d9">🔧 管理已开启</span>
<div style="display:flex;gap:4px;flex-wrap:wrap">
<button class="btn btn-ghost btn-sm" onclick="openSync()">☁️ 同步</button>
<button class="btn btn-ghost btn-sm" onclick="openAnn()">📢 公告</button>
<button class="btn btn-ghost btn-sm" onclick="openPwd()">🔑 改密</button>
<button class="btn btn-ghost btn-sm" onclick="exportData()">📥 导出</button>
<button class="btn btn-ghost btn-sm" onclick="document.getElementById('impFile').click()">📤 导入</button>
<input type="file" id="impFile" accept=".json" style="display:none" onchange="importData(event)">
<button class="btn btn-sm" onclick="openAdd()" style="background:#4f6ef7;color:#fff">＋ 新增</button>
</div></div>

<div class="tabs" id="viewTabs">
<button class="tab on" onclick="swView('type')">📂 按类型</button>
<button class="tab" onclick="swView('dept')">🏢 按部门</button>
<button class="tab" onclick="swView('date')">📅 按日期</button>
<button class="tab" onclick="swView('all')">📋 全部</button>
<button class="tab" onclick="swView('log')">📋 记录</button>
</div>

<div class="bar">
<div class="search"><span>🔍</span><input id="sInput" placeholder="搜索..." oninput="render()"></div>
<span class="chip on" onclick="setDR('all')" id="drAll">全部</span>
<span class="chip" onclick="setDR('today')" id="drToday">今天</span>
<span class="chip" onclick="setDR('week')" id="drWeek">本周</span>
<span class="chip" onclick="setDR('month')" id="drMonth">本月</span>
</div>

<div id="content"><div class="empty"><div class="eicon">📭</div><p>暂无数据</p></div></div>
</div>

<!-- Sync Modal -->
<div class="overlay" id="syncModal"><div class="modal" style="max-width:360px">
<h2>☁️ 云同步</h2>
<p style="font-size:12px;color:#6b7280;margin-bottom:10px">配置后数据自动同步到 GitHub</p>
<div class="form-group"><label>GitHub Token</label><input type="password" id="sToken" placeholder="ghp_..."></div>
<div id="sMsg" style="font-size:12px;margin-top:4px"></div>
<div class="form-acts"><button class="btn btn-ghost btn-sm" onclick="closeOver('syncModal')">取消</button><button class="btn btn-ghost btn-sm" onclick="testSync()" style="color:#4f6ef7">测试</button><button class="btn btn-green btn-sm" onclick="saveSync()">保存</button></div>
</div></div>

<!-- Pwd Modal -->
<div class="overlay" id="pwdModal"><div class="modal" style="max-width:320px;text-align:center">
<div style="font-size:32px;margin-bottom:8px">🔒</div>
<h2>管理员验证</h2>
<p style="font-size:12px;color:#6b7280;margin-bottom:12px">请输入管理密码</p>
<input type="password" id="pwdInput" placeholder="密码" style="width:100%;padding:7px 10px;border:1.5px solid #e5e7eb;border-radius:6px;font-size:13px;outline:none;text-align:center" onkeydown="if(event.key==='Enter')doPwd()">
<div id="pwdErr" style="color:#ef4444;font-size:12px;display:none;margin-top:4px">密码错误</div>
<div class="form-acts" style="justify-content:center;border:none;padding:0;margin-top:12px">
<button class="btn btn-ghost btn-sm" onclick="closeOver('pwdModal')">取消</button>
<button class="btn btn-sm" onclick="doPwd()" style="background:#4f6ef7;color:#fff">确认</button>
</div></div></div>

<!-- Pwd Change -->
<div class="overlay" id="pcModal"><div class="modal" style="max-width:360px">
<h2>🔑 修改密码</h2>
<div class="form-group"><label>当前密码</label><input type="password" id="opwd"></div>
<div class="form-group"><label>新密码</label><input type="password" id="npwd"></div>
<div class="form-group"><label>确认新密码</label><input type="password" id="cpwd"></div>
<div id="pcErr" style="color:#ef4444;font-size:12px;display:none"></div>
<div class="form-acts"><button class="btn btn-ghost btn-sm" onclick="closeOver('pcModal')">取消</button><button class="btn btn-green btn-sm" onclick="doPc()">确认</button></div>
</div></div>

<!-- Link Modal -->
<div class="overlay" id="linkModal"><div class="modal">
<h2 id="lmTitle">新增链接</h2>
<form onsubmit="saveLink(event)"><input type="hidden" id="editId">
<div class="form-group"><label>标题</label><input id="fTitle" required></div>
<div class="form-group"><label>链接（没有可不填）</label><input id="fUrl" placeholder="https://..."></div>
<div class="form-group"><label>描述</label><textarea id="fDesc" rows="2"></textarea></div>
<div class="form-row"><div class="form-group"><label>类型</label><select id="fType"><option>日报</option><option>周报</option><option>公告</option><option>通知</option><option>项目文档</option><option>其他</option></select></div>
<div class="form-group"><label>部门</label><select id="fDept"><option>全公司</option><option>销售部</option><option>技术部</option><option>运营部</option><option>人事行政</option><option>财务部</option><option>市场部</option><option>客服部</option><option>其他</option></select></div></div>
<div class="form-group"><label>标签（逗号分隔）</label><input id="fTags" placeholder="重要,紧急"></div>
<div class="form-group"><label>日期</label><div style="display:flex;gap:8px;align-items:center"><input type="date" id="fDate" style="flex:1"><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="fToday" style="width:auto"> 今日</label></div></div>
<div class="form-acts"><button type="button" class="btn btn-ghost btn-sm" onclick="closeOver('linkModal')">取消</button><button type="submit" class="btn btn-green btn-sm">保存</button></div></form>
</div></div>

<!-- Card Detail -->
<div class="overlay" id="detailModal"><div class="modal" style="max-width:440px">
<div style="display:flex;justify-content:space-between;align-items:flex-start"><div id="dType"></div><span onclick="closeOver('detailModal')" style="cursor:pointer;font-size:16px;color:#9ca3af">✕</span></div>
<h2 id="dTitle" style="font-size:16px;font-weight:700;margin:6px 0 4px"></h2>
<p id="dDesc" style="font-size:12px;color:#6b7280;line-height:1.6;margin-bottom:8px"></p>
<div id="dImgs" style="display:grid;gap:4px;margin-bottom:8px"></div>
<div style="background:#f9fafb;border-radius:6px;padding:10px;margin-bottom:8px">
<div style="display:flex;margin-bottom:3px"><span style="font-size:11px;color:#9ca3af;width:52px">部门</span><span id="dDept" style="font-size:11px"></span></div>
<div style="display:flex;margin-bottom:3px"><span style="font-size:11px;color:#9ca3af;width:52px">日期</span><span id="dDate" style="font-size:11px"></span></div>
<div style="display:flex"><span style="font-size:11px;color:#9ca3af;width:52px">标签</span><span id="dTags" style="font-size:11px"></span></div>
</div>
<div id="dActs" style="display:flex;flex-direction:column;gap:4px"></div>
<button onclick="closeOver('detailModal')" style="width:100%;margin-top:8px;padding:8px;border:1px solid #e5e7eb;border-radius:6px;background:#fff;color:#6b7280;font-size:12px;cursor:pointer">关闭</button>
</div></div>

<!-- Announce Modal -->
<div class="overlay" id="annModal"><div class="modal" style="max-width:520px">
<h2>📢 公告管理</h2>
<div style="background:#f9fafb;border-radius:8px;padding:10px;margin-bottom:10px">
<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span id="afTitle" style="font-size:12px;font-weight:600">新增公告</span><span id="acBtn" style="display:none;font-size:11px;color:#4f6ef7;cursor:pointer" onclick="cancelAE()">取消编辑</span></div>
<input type="hidden" id="aeIdx" value="-1">
<div class="form-row"><div class="form-group"><select id="aIcn"><option>📢</option><option>🎉</option><option>⚠️</option><option>🚨</option><option>📌</option><option>💡</option></select></div>
<div class="form-group"><input id="aTtl" placeholder="标题"></div></div>
<div class="form-group"><textarea id="aCtx" rows="2" placeholder="内容"></textarea></div>
<div class="form-row"><div class="form-group"><select id="aFr"><option value="always">每次都显示</option><option value="hourly">每小时</option><option value="daily">每天</option><option value="weekly">每周</option><option value="once">仅一次</option></select></div>
<div class="form-group"><input type="date" id="aExp"></div></div>
<div style="display:flex;gap:6px;align-items:center"><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="aEn" checked style="width:auto"> 启用</label><button class="btn btn-green btn-sm" onclick="saveA()">保存</button></div>
<div id="aErr" style="color:#ef4444;font-size:12px;display:none"></div></div>
<div style="font-size:12px;font-weight:600;margin-bottom:4px">公告列表 <span id="aCnt" style="font-weight:400;color:#9ca3af"></span></div>
<div id="aLst" style="max-height:180px;overflow-y:auto"></div>
<div class="form-acts"><button class="btn btn-ghost btn-sm" onclick="clrAllA()" style="color:#ef4444">清空全部</button><button class="btn btn-ghost btn-sm" onclick="closeOver('annModal')">关闭</button></div>
</div></div>

<!-- Lightbox -->
<div class="overlay" id="lb" onclick="closeLb()">
<div style="display:flex;align-items:center;gap:8px"><button id="lbP" class="btn btn-white" style="font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();lbP()">‹</button><img id="lbImg" style="max-width:75vw;max-height:80vh;border-radius:8px"><button id="lbN" class="btn btn-white" style="font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();lbN()">›</button></div>
<span id="lbC" style="position:absolute;bottom:12px;background:rgba(0,0,0,.5);color:#fff;padding:2px 10px;border-radius:10px;font-size:11px"></span></div>

<div class="toasts" id="toastC"></div>

<script>
var links=[],admin=false,view='type',dr='all',tok=null,ims=[],imIdx=0,anns=[],aIdx=0,lbIms=[];
var LS='loomy_links',PW='loomy_pwd',TK='loomy_tok',AK='loomy_anns',LG='loomy_logs';
var GH='liubohua8888888888',GR='hotline-board',GF='data.json';

function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(m,t){var c=document.getElementById('toastC'),o=document.createElement('div');o.className='toast '+(t||'b');o.textContent=m;c.appendChild(o);setTimeout(function(){o.style.opacity='0';setTimeout(function(){o.remove()},300)},2000)}
function closeOver(id){document.getElementById(id).classList.remove('show')}
function openOver(id){document.getElementById(id).classList.add('show')}
function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}

// Init - 直接从data.json加载并嵌入默认数据
function init(){
  document.getElementById('dateDisplay').textContent=today();
  loadTok();updSync();
  var s=localStorage.getItem(LS);
  if(s){try{var d=JSON.parse(s);if(d.length)links=d}catch(e){}}
  if(!links.length){
    var x=new XMLHttpRequest();
    x.open('GET','https://raw.githubusercontent.com/'+GH+'/'+GR+'/main/'+GF);
    x.onload=function(){if(x.status===200){try{var d=JSON.parse(x.responseText);if(d.length){links=d;localStorage.setItem(LS,x.responseText);render()}}catch(e){}}render()};
    x.onerror=function(){render()};
    x.send()
  }else render();
  // Announcements
  loadAnn();setTimeout(function(){showAnn()},500);
  // Lightbox
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')lbP();if(e.key==='ArrowRight')lbN()});
}

// Password
function getPw(){return localStorage.getItem(PW)||btoa('admin123')}
function toggleAdmin(){
  if(admin){admin=false;document.getElementById('adminPanel').style.display='none';render();return}
  document.getElementById('pwdInput').value='';document.getElementById('pwdErr').style.display='none';openOver('pwdModal')
}
function doPwd(){if(btoa(document.getElementById('pwdInput').value)===getPw()){admin=true;document.getElementById('adminPanel').style.display='flex';closeOver('pwdModal');render();toast('已进入管理','b')}else{document.getElementById('pwdErr').style.display='block'}}

// Cloud
function loadTok(){var s=localStorage.getItem(TK);if(s){try{tok=JSON.parse(s)}catch(e){}}}
function saveTok(){localStorage.setItem(TK,JSON.stringify(tok))}
function updSync(){var e=document.getElementById('syncStatus');e.textContent=tok&&tok.t?'☁️ 已同步':'☁️ 本地'}
function openSync(){loadTok();document.getElementById('sToken').value=tok&&tok.t?tok.t:'';document.getElementById('sMsg').textContent='';document.getElementById('sMsg').style.color='';openOver('syncModal')}
function testSync(){
  var t=document.getElementById('sToken').value.trim(),m=document.getElementById('sMsg');
  if(!t){m.textContent='请输入Token';m.style.color='#ef4444';return}
  var x=new XMLHttpRequest();x.open('GET','https://api.github.com/user');x.setRequestHeader('Authorization','token '+t);

function apP(){if(aIdx>0){aIdx--;popAnn()}}
function apN(){var a=getActive();if(aIdx<a.length-1){aIdx++;popAnn()}}

function openAnn(){loadAnn();document.getElementById('aeIdx').value='-1';document.getElementById('afTitle').textContent='新增公告';document.getElementById('acBtn').style.display='none';document.getElementById('aErr').style.display='none';clAF();rAL();openOver('annModal')}
function clAF(){document.getElementById('aIcn').value='📢';document.getElementById('aTtl').value='';document.getElementById('aCtx').value='';document.getElementById('aFr').value='always';document.getElementById('aExp').value='';document.getElementById('aEn').checked=true}
function cancelAE(){document.getElementById('aeIdx').value='-1';document.getElementById('afTitle').textContent='新增公告';document.getElementById('acBtn').style.display='none';clAF()}
function saveA(){var t=document.getElementById('aTtl').value.trim(),c=document.getElementById('aCtx').value.trim();if(!t||!c){document.getElementById('aErr').textContent='请填写标题和内容';document.getElementById('aErr').style.display='block';return}document.getElementById('aErr').style.display='none';var ei=parseInt(document.getElementById('aeIdx').value),l=getAnn();var it={id:Date.now()+Math.random(),ic:document.getElementById('aIcn').value,tt:t,ct:c,fr:document.getElementById('aFr').value,exp:document.getElementById('aExp').value,en:document.getElementById('aEn').checked,da:today()};if(ei>=0&&ei<l.length){it.id=l[ei].id;l[ei]=it;toast('已更新','g')}else{l.push(it);toast('已添加','g')}saveAnn(l);rAL();clAF();document.getElementById('aeIdx').value='-1';document.getElementById('afTitle').textContent='新增公告';document.getElementById('acBtn').style.display='none'}
function editA(i){var l=getAnn(),it=l[i];if(!it)return;document.getElementById('afTitle').textContent='编辑公告';document.getElementById('aeIdx').value=i;document.getElementById('acBtn').style.display='';document.getElementById('aIcn').value=it.ic||'📢';document.getElementById('aTtl').value=it.tt||'';document.getElementById('aCtx').value=it.ct||'';document.getElementById('aFr').value=it.fr||'always';document.getElementById('aExp').value=it.exp||'';document.getElementById('aEn').checked=it.en!==false}
function delA(i){if(!confirm('确定删除？'))return;var l=getAnn();l.splice(i,1);saveAnn(l);rAL();toast('已删除','b')}
function rAL(){var l=getAnn();document.getElementById('aCnt').textContent='('+l.length+'条)';var c=document.getElementById('aLst');if(!l.length){c.innerHTML='<div style="padding:12px;text-align:center;color:#9ca3af;font-size:11px">暂无公告</div>';return}var lb={always:'总是',hourly:'每小时',daily:'每天',weekly:'每周',once:'仅一次'};c.innerHTML=l.map(function(it,i){return'<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid #e5e7eb;border-radius:6px;margin-bottom:4px;;background:'+(it.en!==false?'#fff':'#f9fafb')+'"><span style="font-size:16px">'+(it.ic||'📢')+'</span><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600">'+it.tt+(it.en===false?' <span style="color:#9ca3af;font-weight:400">(禁用)</span>':'')+'</div><div style="font-size:9px;color:#9ca3af">'+(lb[it.fr]||'总是')+(it.exp?' · 至 '+it.exp:'')+'</div></div><button class="btn btn-ghost btn-sm" onclick="editA('+i+')">✏️</button><button class="btn btn-red btn-sm" onclick="delA('+i+')">🗑️</button></div>'}).join('')}
function clrAllA(){if(!confirm('确定清空全部公告？'))return;localStorage.removeItem(AK);document.getElementById('aLst').innerHTML='<div style="padding:12px;text-align:center;color:#9ca3af;font-size:11px">暂无公告</div>';document.getElementById('aCnt').textContent='';toast('已清空','b')}

init();
</script></body></html>
