<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>热线看板</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--primary:#4f6ef7;--primary-light:#eef1ff;--success:#22c55e;--danger:#ef4444;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 10px 25px rgba(0,0,0,.1);--font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{font-family:var(--font);background:var(--gray-50);color:var(--gray-800)}
.header{background:linear-gradient(135deg,#4f6ef7,#6c5ce7);color:#fff;padding:20px 24px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(79,110,247,.3)}
.header-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.header h1{font-size:18px;font-weight:700}
.header p{font-size:11px;opacity:.8;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:none;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);text-decoration:none;transition:all .15s}
.btn-w{background:#fff;color:#4f6ef7}.btn-w:hover{background:#eef1ff}
.btn-o{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.4)}.btn-o:hover{background:rgba(255,255,255,.1)}
.btn-s{padding:4px 10px;font-size:11px;border-radius:5px}
.btn-g{background:#22c55e;color:#fff}.btn-g:hover{background:#16a34a}
.btn-r{background:#ef4444;color:#fff}.btn-r:hover{background:#dc2626}
.btn-ghost{background:transparent;color:var(--gray-600)}.btn-ghost:hover{background:var(--gray-100)}
.stats{max-width:1200px;margin:-10px auto 0;padding:0 20px;position:relative;z-index:10}
.stats-inner{background:#fff;border-radius:10px;box-shadow:var(--shadow-lg);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.stats-inner>div{padding:14px 10px;text-align:center}
.stats-inner>div+div{border-left:1px solid var(--gray-100)}
.stat-n{font-size:20px;font-weight:700;color:var(--primary)}.stat-l{font-size:11px;color:var(--gray-400);margin-top:2px}
.main{max-width:1200px;margin:0 auto;padding:14px 20px 40px}
.tabs{display:flex;gap:2px;margin-bottom:10px;background:var(--gray-100);padding:3px;border-radius:6px;width:fit-content;flex-wrap:wrap}
.tab{padding:5px 12px;border-radius:5px;font-size:11px;border:none;background:transparent;color:var(--gray-500);cursor:pointer;font-family:var(--font)}
.tab.on{background:#fff;color:var(--primary);box-shadow:var(--shadow)}
.bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.sb{flex:1;min-width:160px;position:relative}
.sb input{width:100%;padding:7px 12px 7px 30px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:12px;outline:none;font-family:var(--font)}
.sb input:focus{border-color:var(--primary)}.sb span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--gray-400);font-size:11px}
.chip{padding:3px 8px;border-radius:12px;font-size:11px;cursor:pointer;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-500)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.card{background:#fff;border-radius:10px;box-shadow:var(--shadow);padding:14px;position:relative;cursor:pointer;display:flex;flex-direction:column;border:1px solid transparent;transition:all .15s}
.card:hover{box-shadow:0 4px 12px rgba(0,0,0,.1);transform:translateY(-2px)}
.card.today{border-color:var(--primary);background:linear-gradient(135deg,#fff,var(--primary-light))}
.bdg{position:absolute;top:-7px;right:10px;background:var(--primary);color:#fff;font-size:9px;padding:2px 8px;border-radius:8px;font-weight:600;box-shadow:0 2px 6px rgba(79,110,247,.3)}
.tt{font-size:10px;padding:2px 8px;border-radius:6px;font-weight:500}
.tt-日报{background:#dbeafe;color:#1d4ed8}.tt-周报{background:#dcfce7;color:#15803d}.tt-公告{background:#fef3c7;color:#b45309}.tt-通知{background:#fce7f3;color:#be185d}.tt-项目文档{background:#ede9fe;color:#6d28d9}.tt-其他{background:var(--gray-100);color:var(--gray-600)}
.card h3{font-size:13px;font-weight:600;margin:5px 0 3px;line-height:1.4}
.card .dsc{font-size:11px;color:var(--gray-500);line-height:1.6;margin-bottom:6px;white-space:pre-wrap}
.card .mt{font-size:10px;color:var(--gray-400);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.card .mt .d{background:var(--gray-100);padding:1px 5px;border-radius:3px;color:var(--gray-500)}
.tgl{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.mtgl{font-size:9px;padding:1px 5px;border-radius:3px;background:var(--gray-100);color:var(--gray-500)}
.acts{display:flex;gap:4px;margin-top:auto;border-top:1px solid var(--gray-100);padding-top:8px}
.ig{display:grid;gap:4px;margin:6px 0}
.ig img{width:100%;height:100%;object-fit:cover;border-radius:4px}
.at{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--gray-50);border-radius:4px;margin-top:4px;font-size:10px;color:var(--gray-600)}
.empty{padding:50px 20px;text-align:center;color:var(--gray-400)}
.empty .ei{font-size:36px;margin-bottom:8px}.empty p{font-size:13px}
.st{font-size:14px;font-weight:600;margin-bottom:8px;margin-top:14px;display:flex;align-items:center;gap:4px}
.st .c{font-weight:400;color:var(--gray-400);font-size:11px}
.grp{margin-bottom:20px}
.ol{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.ol.s{display:flex}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:85vh;overflow-y:auto;padding:20px;animation:f .25s}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.modal h2{font-size:16px;font-weight:700;margin-bottom:12px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:11px;font-weight:500;color:var(--gray-700);margin-bottom:2px}
.fg input,.fg select,.fg textarea{width:100%;padding:7px 10px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:12px;outline:none;font-family:var(--font)}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--primary)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fa{display:flex;justify-content:flex-end;gap:6px;margin-top:12px;border-top:1px solid var(--gray-100);padding-top:10px}
.err{color:var(--danger);font-size:11px;display:none;margin-top:3px}
.toasts{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:4px}
.toast{padding:8px 16px;border-radius:6px;color:#fff;font-size:12px;box-shadow:var(--shadow-lg);animation:ti .3s}
.toast.s{background:var(--success)}.toast.e{background:var(--danger)}.toast.i{background:var(--primary)}
@keyframes ti{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:640px){.stats-inner{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.fr{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="header"><div class="header-inner">
<div><h1>热线看板</h1><p>业务更新 · 数据报告 · 每日跟进</p></div>
<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
<span id="syncStatus" style="font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px">☁️ 本地</span>
<span id="dateDsp" style="font-size:11px;background:rgba(255,255,255,.12);padding:2px 8px;border-radius:8px"></span>
<button class="btn btn-o btn-s" onclick="togAdmin()">🔧 管理</button>
</div></div></div>

<div class="stats"><div class="stats-inner">
<div><div class="stat-n" id="sTotal">0</div><div class="stat-l">全部</div></div>
<div><div class="stat-n" id="sToday">0</div><div class="stat-l">今日更新</div></div>
<div><div class="stat-n" id="sTypes">0</div><div class="stat-l">分类</div></div>
<div><div class="stat-n" id="sDepts">0</div><div class="stat-l">部门</div></div>
</div></div>

<div class="main">

<div id="adminPanel" style="display:none;background:#eef2ff;border:1px solid #c7d2fe;border-radius:8px;padding:10px 14px;margin-bottom:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px">
<span style="font-size:12px;font-weight:500;color:#3b55d9">🔧 管理</span>
<div style="display:flex;gap:4px;flex-wrap:wrap">
<button class="btn btn-ghost btn-s" onclick="openCloud()">☁️ 同步</button>
<button class="btn btn-ghost btn-s" onclick="openAnnMgr()">📢 公告</button>
<button class="btn btn-ghost btn-s" onclick="openChgPwd()">🔑 改密</button>
<button class="btn btn-ghost btn-s" onclick="expData()">📥 导出</button>
<button class="btn btn-ghost btn-s" onclick="document.getElementById('impF').click()">📤 导入</button>
<input type="file" id="impF" accept=".json" style="display:none" onchange="impData(event)">
<button class="btn btn-s" onclick="openAdd()" style="background:var(--primary);color:#fff">＋ 新增</button>
</div></div>

<div class="tabs">
<button class="tab on" onclick="swV('type')">📂 按类型</button>
<button class="tab" onclick="swV('dept')">🏢 按部门</button>
<button class="tab" onclick="swV('date')">📅 按日期</button>
<button class="tab" onclick="swV('all')">📋 全部</button>
<button class="tab" onclick="swV('log')">📋 记录</button>
</div>

<div class="bar">
<div class="sb"><span>🔍</span><input id="sIpt" placeholder="搜索..." oninput="render()"></div>
<span class="chip on" onclick="setDr('all')" id="drA">全部</span>
<span class="chip" onclick="setDr('today')" id="drT">📅 今天</span>
<span class="chip" onclick="setDr('week')" id="drW">📅 本周</span>
<span class="chip" onclick="setDr('month')" id="drM">📅 本月</span>
</div>

<div id="content"><div class="empty"><div class="ei">📭</div><p>暂无数据</p></div></div>
</div>

<!-- Sync -->
<div class="ol" id="syncModal"><div class="modal" style="max-width:360px">
<h2>☁️ 云同步</h2>
<p style="font-size:12px;color:var(--gray-500);margin-bottom:10px">配置后数据自动同步到 GitHub</p>
<div class="fg"><label>GitHub Token</label><input type="password" id="syncTok" placeholder="ghp_..."></div>
<div id="syncMsg" style="font-size:12px;margin-top:4px"></div>
<div class="fa"><button class="btn btn-ghost btn-s" onclick="closeOl('syncModal')">取消</button><button class="btn btn-ghost btn-s" onclick="testSync()" style="color:var(--primary)">测试</button><button class="btn btn-g btn-s" onclick="saveSync()">保存</button></div></div></div>

<!-- Pwd -->
<div class="ol" id="pwdModal"><div class="modal" style="max-width:320px;text-align:center">
<div style="font-size:30px;margin-bottom:8px">🔒</div>
<h2>管理员验证</h2>
<p style="font-size:12px;color:var(--gray-500);margin-bottom:12px">请输入管理密码</p>
<input type="password" id="pwdIpt" placeholder="密码" style="width:100%;padding:7px 10px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:13px;outline:none;text-align:center" onkeydown="if(event.key==='Enter')chkPwd()">
<div id="pwdErr" style="color:var(--danger);font-size:12px;display:none;margin-top:4px">密码错误</div>
<div class="fa" style="justify-content:center;border:none;padding:0;margin-top:12px">
<button class="btn btn-ghost btn-s" onclick="closeOl('pwdModal')">取消</button>
<button class="btn btn-s" onclick="chkPwd()" style="background:var(--primary);color:#fff">确认</button></div></div></div>

<!-- Change Pwd -->
<div class="ol" id="pcModal"><div class="modal" style="max-width:360px">
<h2>🔑 修改密码</h2>
<div class="fg"><label>当前密码</label><input type="password" id="opwd"></div>
<div class="fg"><label>新密码</label><input type="password" id="npwd"></div>
<div class="fg"><label>确认新密码</label><input type="password" id="cpwd"></div>
<div id="pcErr" class="err"></div>
<div class="fa"><button class="btn btn-ghost btn-s" onclick="closeOl('pcModal')">取消</button><button class="btn btn-g btn-s" onclick="doPc()">确认</button></div></div></div>

<!-- Link Modal -->
<div class="ol" id="linkModal"><div class="modal">
<h2 id="lmT">新增链接</h2>
<form onsubmit="svLink(event)"><input type="hidden" id="eId">
<div class="fg"><label>标题 *</label><input id="fT" required></div>
<div class="fg"><label>链接（可不填）</label><input id="fU" placeholder="https://..."></div>
<div class="fg"><label>描述</label><textarea id="fD" rows="2"></textarea></div>
<div class="fr"><div class="fg"><label>类型</label><select id="fTy"><option>日报</option><option>周报</option><option>公告</option><option>通知</option><option>项目文档</option><option>其他</option></select></div>
<div class="fg"><label>部门</label><select id="fDe"><option>全公司</option><option>销售部</option><option>技术部</option><option>运营部</option><option>人事行政</option><option>财务部</option><option>市场部</option><option>客服部</option><option>其他</option></select></div></div>
<div class="fg"><label>标签（逗号分隔）</label><input id="fTa" placeholder="重要,紧急"></div>
<div class="fr"><div class="fg"><label>日期</label><input type="date" id="fDa"></div>
<div class="fg" style="display:flex;align-items:flex-end;padding-bottom:2px"><label style="display:flex;align-items:center;gap:4px;font-size:12px;margin:0"><input type="checkbox" id="fNo" style="width:auto"> 今日</label></div></div>
<div class="fa"><button type="button" class="btn btn-ghost btn-s" onclick="closeOl('linkModal')">取消</button><button type="submit" class="btn btn-g btn-s">保存</button></div></form></div></div>

<!-- Detail -->
<div class="ol" id="dtModal"><div class="modal" style="max-width:440px">
<div style="display:flex;justify-content:space-between;align-items:flex-start"><div id="dtT"></div><span onclick="closeOl('dtModal')" style="cursor:pointer;font-size:16px;color:var(--gray-400)">✕</span></div>
<h2 id="dtTi" style="font-size:16px;font-weight:700;margin:6px 0 4px"></h2>
<p id="dtDe" style="font-size:12px;color:var(--gray-500);line-height:1.6;margin-bottom:8px"></p>
<div id="dtIm" style="display:grid;gap:4px;margin-bottom:8px"></div>
<div style="background:var(--gray-50);border-radius:6px;padding:10px;margin-bottom:8px">
<div style="display:flex;margin-bottom:3px"><span style="font-size:11px;color:var(--gray-400);width:52px">部门</span><span id="dtDp" style="font-size:11px"></span></div>
<div style="display:flex;margin-bottom:3px"><span style="font-size:11px;color:var(--gray-400);width:52px">日期</span><span id="dtDa" style="font-size:11px"></span></div>
<div style="display:flex"><span style="font-size:11px;color:var(--gray-400);width:52px">标签</span><span id="dtTg" style="font-size:11px"></span></div></div>
<div id="dtAc" style="display:flex;flex-direction:column;gap:4px"></div>
<button onclick="closeOl('dtModal')" style="width:100%;margin-top:8px;padding:8px;border:1px solid var(--gray-200);border-radius:6px;background:#fff;color:var(--gray-500);font-size:12px;cursor:pointer">关闭</button></div></div>

<!-- Announce -->
<div class="ol" id="annModal"><div class="modal" style="max-width:520px">
<h2>📢 公告管理</h2>
<div style="background:var(--gray-50);border-radius:8px;padding:10px;margin-bottom:10px">
<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px"><span id="afT" style="font-size:12px;font-weight:600">新增公告</span><span id="acB" style="display:none;font-size:11px;color:var(--primary);cursor:pointer" onclick="cancelAE()">取消编辑</span></div>
<input type="hidden" id="aeI" value="-1">
<div class="fr"><div class="fg"><select id="aIc"><option>📢</option><option>🎉</option><option>⚠️</option><option>🚨</option><option>📌</option><option>💡</option></select></div>
<div class="fg"><input id="aTt" placeholder="标题"></div></div>
<div class="fg"><textarea id="aCt" rows="2" placeholder="内容"></textarea></div>
<div class="fr"><div class="fg"><select id="aFr"><option value="always">每次都显示</option><option value="hourly">每小时</option><option value="daily">每天</option><option value="weekly">每周</option><option value="once">仅一次</option></select></div>
<div class="fg"><input type="date" id="aEx"></div></div>
<div style="display:flex;gap:6px;align-items:center"><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="aEn" checked style="width:auto"> 启用</label><button class="btn btn-g btn-s" onclick="svAnn()">保存</button></div>
<div id="aEr" class="err"></div></div>
<div style="font-size:12px;font-weight:600;margin-bottom:4px">公告列表 <span id="aCn" style="font-weight:400;color:var(--gray-400)"></span></div>
<div id="aLs" style="max-height:180px;overflow-y:auto"></div>
<div class="fa"><button class="btn btn-ghost btn-s" onclick="clrAll()" style="color:var(--danger)">清空全部</button><button class="btn btn-ghost btn-s" onclick="closeOl('annModal')">关闭</button></div></div></div>

<!-- Lightbox -->
<div class="ol" id="lb" onclick="closeLb()">
<div style="display:flex;align-items:center;gap:10px">
<button id="lbP" class="btn btn-w" style="font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();lbPr()">‹</button>
<img id="lbI" style="max-width:75vw;max-height:80vh;border-radius:8px">
<button id="lbN" class="btn btn-w" style="font-size:22px;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center" onclick="event.stopPropagation();lbN()">›</button></div>
<span id="lbC" style="position:absolute;bottom:12px;background:rgba(0,0,0,.5);color:#fff;padding:2px 10px;border-radius:10px;font-size:11px"></span></div>

<div class="toasts" id="tC"></div>

<script>
var links=[],admin=false,vw='type',dr='all',tok=null,lbI=[],lbX=0,ann=[],annX=0,lgM=2;
var SK='loomy_links',PK='loomy_pwd',TK='loomy_tok',AK='loomy_anns',LK='loomy_logs';
var GH='liubohua8888888888',GR='hotline-board',GF='data.json';

function td(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function toast(m,t){var c=document.getElementById('tC'),o=document.createElement('div');o.className='toast '+(t||'i');o.textContent=m;c.appendChild(o);setTimeout(function(){o.style.opacity='0';setTimeout(function(){o.remove()},300)},2000)}
function closeOl(i){document.getElementById(i).classList.remove('show')}
function openOl(i){document.getElementById(i).classList.add('show')}
function qs(s){return document.querySelector(s)}
function qsa(s){return document.querySelectorAll(s)}

function init(){
  document.getElementById('dateDsp').textContent=td();loadTok();updSync();
  var s=localStorage.getItem(SK);
  if(s){try{var d=JSON.parse(s);if(d.length)links=d}catch(e){}}
  if(!links.length)loadFromGH();
  render();loadAnn();setTimeout(function(){shAnn()},500);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLb();if(e.key==='ArrowLeft')lbPr();if(e.key==='ArrowRight')lbN()});
}
function loadFromGH(){
  var x=new XMLHttpRequest();
  x.open('GET','https://raw.githubusercontent.com/'+GH+'/'+GR+'/main/'+GF);
  x.onload=function(){if(x.status===200){try{var d=JSON.parse(x.responseText);if(d.length){links=d;localStorage.setItem(SK,x.responseText);render()}}catch(e){}render()}else render()};
  x.onerror=function(){render()};x.send()
}

// Pwd
function gp(){return localStorage.getItem(PK)||btoa('admin123')}
function togAdmin(){
  if(admin){admin=false;document.getElementById('adminPanel').style.display='none';render();return}
  document.getElementById('pwdIpt').value='';document.getElementById('pwdErr').style.display='none';openOl('pwdModal')
}
function chkPwd(){if(btoa(document.getElementById('pwdIpt').value)===gp()){admin=true;document.getElementById('adminPanel').style.display='flex';closeOl('pwdModal');render();toast('已进入管理','i')}else{document.getElementById('pwdErr').style.display='block'}}
function openChgPwd(){document.getElementById('opwd').value='';document.getElementById('npwd').value='';document.getElementById('cpwd').value='';document.getElementById('pcErr').style.display='none';openOl('pcModal')}

// Sync
function loadTok(){var s=localStorage.getItem(TK);if(s){try{tok=JSON.parse(s)}catch(e){}}}
function saveTok(){localStorage.setItem(TK,JSON.stringify(tok))}
function updSync(){var e=document.getElementById('syncStatus');e.textContent=tok&&tok.t?'☁️ 已同步':'☁️ 本地'}
function openCloud(){loadTok();document.getElementById('syncTok').value=tok&&tok.t?tok.t:'';document.getElementById('syncMsg').textContent='';openOl('syncModal')}
function testSync(){
  var t=document.getElementById('syncTok').value.trim(),m=document.getElementById('syncMsg');
  if(!t){m.textContent='请输入Token';m.style.color='#ef4444';return}
  var x=new XMLHttpRequest();x.open('GET','https://api.github.com/user');x.setRequestHeader('Authorization','token '+t);
  x.onload=function(){if(x.status===200){var u=JSON.parse(x.responseText);m.textContent='✅ 用户: '+u.login;m.style.color='#22c55e'}else{m.textContent='❌ Token无效';m.style.color='#ef4444'}};
  x.onerror=function(){m.textContent='❌ 网络错误';m.style.color='#ef4444'};x.send()
}
function saveSync(){
  var t=document.getElementById('syncTok').value.trim();if(!t){toast('请输入Token','e');return}
  tok={t:t};saveTok();updSync();closeOl('syncModal');toast('已保存','g')
}
function sync2c(){
  if(!tok||!tok.t)return;
  var t=tok.t,c=btoa(unescape(encodeURIComponent(JSON.stringify(links,null,2))));
  var x=new XMLHttpRequest();x.open('GET','https://api.github.com/repos/'+GH+'/'+GR+'/contents/'+GF);
  x.setRequestHeader('Authorization','token '+t);
  x.onload=function(){
    var sha=null;if(x.status===200)sha=JSON.parse(x.responseText).sha;
    var b={message:'更新看板',content:c,branch:'main'};if(sha)b.sha=sha;
    var x2=new XMLHttpRequest();x2.open('PUT','https://api.github.com/repos/'+GH+'/'+GR+'/contents/'+GF);
    x2.setRequestHeader('Authorization','token '+t);x2.setRequestHeader('Content-Type','application/json');
    x2.onload=function(){if(x2.status<300)toast('☁️ 已同步','g')};
    x2.onerror=function(){};x2.send(JSON.stringify(b))
  };x.onerror=function(){};x.send()
}

function render(){
  var q=(document.getElementById('sIpt').value||'').trim().toLowerCase(),c=document.getElementById('content');
  if(vw==='log'){shLogs();return}
  var a=[];for(var i=0;i<links.length;i++)a.push(links[i]);
  if(q)a=a.filter(function(l){return(l.title||'').toLowerCase().includes(q)||(l.description||'').toLowerCase().includes(q)||(l.tags||[]).some(function(t){return t.toLowerCase().includes(q)})});
  if(dr!=='all'){var t=td(),n=new Date();if(dr==='today')a=a.filter(function(l){return l.date===t});else if(dr==='week'){var ws=new Date(n);ws.setDate(n.getDate()-n.getDay());a=a.filter(function(l){return new Date(l.date)>=ws})}else if(dr==='month')a=a.filter(function(l){var d=new Date(l.date);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()})}
  a.sort(function(a,b){if(a.isToday!==b.isToday)return a.isToday?-1:1;return(b.date||'').localeCompare(a.date||'')});
  document.getElementById('sTotal').textContent=links.length;document.getElementById('sToday').textContent=links.filter(function(l){return l.isToday}).length;

  if(vw==='all'){c.innerHTML='<div class="grid">'+a.map(function(l){return bdC(l)}).join('')+'</div>';return}
  var gr={};a.forEach(function(l){var g=vw==='type'?l.type:vw==='dept'?l.department:l.date;if(!gr[g])gr[g]=[];gr[g].push(l)});
  var en=Object.entries(gr);
  if(vw==='type'){var ord=['日报','周报','公告','通知','项目文档','其他'];en.sort(function(a,b){var ai=ord.indexOf(a[0]),bi=ord.indexOf(b[0]);return(ai<0?99:ai)-(bi<0?99:bi)})}else if(vw==='date')en.sort(function(a,b){return b[0].localeCompare(a[0])});else en.sort(function(a,b){return b[1].length-a[1].length});

}

  if(ts.length){annX=0;ppAnn();a.forEach(function(x){localStorage.setItem('la_'+x.id,new Date().toISOString())})}
}
function ppAnn(){var a=getAct(),it=a[annX];if(!it)return;var o=document.getElementById('annPop');if(!o){o=document.createElement('div');o.id='annPop';o.className='ol';o.onclick=function(e){if(e.target===this)o.classList.remove('s')};o.innerHTML='<div class="modal" style="max-width:400px"><div style="text-align:center"><div id="apI" style="font-size:32px;margin-bottom:6px">📢</div><h2 id="apT" style="font-size:16px;font-weight:700"></h2><div id="apTi" style="font-size:10px;color:var(--gray-400);margin:2px 0 8px"></div><div id="apC" style="font-size:12px;line-height:1.8;white-space:pre-wrap;color:var(--gray-700)"></div></div><div style="display:flex;gap:4px;margin-top:10px"><button id="apP" class="btn btn-ghost btn-s" onclick="apPr()">← 上一条</button><button id="apN" class="btn btn-ghost btn-s" onclick="apNe()">下一条 →</button></div><div style="text-align:center;font-size:10px;color:var(--gray-400);margin:4px 0"><span id="apCn"></span></div><button onclick="document.getElementById('annPop').classList.remove('s')" style="width:100%;padding:8px;border:none;border-radius:6px;background:var(--primary);color:#fff;font-size:12px;cursor:pointer">我知道了</button></div>';document.body.appendChild(o)}
  o.classList.add('s');document.getElementById('apI').textContent=it.ic||'📢';document.getElementById('apT').textContent=it.tt||'公告';document.getElementById('apC').textContent=it.ct||'';document.getElementById('apTi').textContent=it.da||'';
  var aa=getAct();document.getElementById('apCn').textContent=(annX+1)+'/'+aa.length;document.getElementById('apP').style.display=annX>0?'':'none';document.getElementById('apN').style.display=annX<aa.length-1?'':'none'
}
function apPr(){if(annX>0){annX--;ppAnn()}}
function apNe(){var a=getAct();if(annX<a.length-1){annX++;ppAnn()}}

// Announce Admin
function openAnnMgr(){loadAnn();document.getElementById('aeI').value='-1';document.getElementById('afT').textContent='新增公告';document.getElementById('acB').style.display='none';document.getElementById('aEr').style.display='none';clAF();rAL();openOl('annModal')}
function clAF(){document.getElementById('aIc').value='📢';document.getElementById('aTt').value='';document.getElementById('aCt').value='';document.getElementById('aFr').value='always';document.getElementById('aEx').value='';document.getElementById('aEn').checked=true}
function cancelAE(){document.getElementById('aeI').value='-1';document.getElementById('afT').textContent='新增公告';document.getElementById('acB').style.display='none';clAF()}
function svAnn(){var t=document.getElementById('aTt').value.trim(),c=document.getElementById('aCt').value.trim();if(!t||!c){document.getElementById('aEr').textContent='请填写标题和内容';document.getElementById('aEr').style.display='block';return}document.getElementById('aEr').style.display='none';var ei=parseInt(document.getElementById('aeI').value),l=getAnn();var it={id:Date.now()+Math.random(),ic:document.getElementById('aIc').value,tt:t,ct:c,fr:document.getElementById('aFr').value,exp:document.getElementById('aEx').value,en:document.getElementById('aEn').checked,da:td()};if(ei>=0&&ei<l.length){it.id=l[ei].id;l[ei]=it;toast('已更新','g')}else{l.push(it);toast('已添加','g')}svAnn(l);rAL();clAF();document.getElementById('aeI').value='-1';document.getElementById('afT').textContent='新增公告';document.getElementById('acB').style.display='none'}
function edA(i){var l=getAnn(),it=l[i];if(!it)return;document.getElementById('afT').textContent='编辑公告';document.getElementById('aeI').value=i;document.getElementById('acB').style.display='';document.getElementById('aIc').value=it.ic||'📢';document.getElementById('aTt').value=it.tt||'';document.getElementById('aCt').value=it.ct||'';document.getElementById('aFr').value=it.fr||'always';document.getElementById('aEx').value=it.exp||'';document.getElementById('aEn').checked=it.en!==false}
function deA(i){if(!confirm('确定删除？'))return;var l=getAnn();l.splice(i,1);svAnn(l);rAL();toast('已删除','i')}
function rAL(){var l=getAnn();document.getElementById('aCn').textContent='('+l.length+'条)';var c=document.getElementById('aLs');if(!l.length){c.innerHTML='<div style="padding:12px;text-align:center;color:var(--gray-400);font-size:11px">暂无</div>';return}var lb={always:'总是',hourly:'每小时',daily:'每天',weekly:'每周',once:'仅一次'};c.innerHTML=l.map(function(it,i){return'<div style="display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--gray-200);border-radius:6px;margin-bottom:4px;background:'+(it.en!==false?'#fff':'var(--gray-50)')+'"><span style="font-size:16px">'+(it.ic||'📢')+'</span><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:600">'+it.tt+(it.en===false?' <span style="color:var(--gray-400);font-weight:400">(禁用)</span>':'')+'</div><div style="font-size:9px;color:var(--gray-400)">'+(lb[it.fr]||'总是')+(it.exp?' · 至 '+it.exp:'')+'</div></div><button class="btn btn-ghost btn-s" onclick="edA('+i+')">✏️</button><button class="btn btn-r btn-s" onclick="deA('+i+')">🗑️</button></div>'}).join('')}
function clrAll(){if(!confirm('确定清空全部公告？'))return;localStorage.removeItem(AK);rAL();toast('已清空','i')}

init();
</script></body></html>
